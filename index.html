<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Supreme Finance – Generator &amp; Alarm Inspection System</title>
<meta name="theme-color" content="#d8232a">
<meta name="mobile-web-app-capable" content="yes">
<script>try{document.documentElement.dataset.theme=localStorage.sf_theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
<style>
:root{--red:#d8232a;--bg:#f4f4f5;--card:#fff;--tx:#111;--mu:#5f5f66;--bd:#dedee2;--sh:0 1px 3px rgba(0,0,0,.08);--r:14px;--ok:#16794a;--wa:#a65b00}
[data-theme=dark]{--red:#ec3b41;--bg:#0b0b0c;--card:#18181a;--tx:#f4f4f5;--mu:#a3a3aa;--bd:#2c2c30;--sh:0 1px 3px rgba(0,0,0,.6);--ok:#4ade80;--wa:#fbbf24}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);transition:background .3s,color .3s}
body *{transition:background-color .3s,border-color .3s}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:16px;margin:20px 0 8px}
.mu{color:var(--mu)}.sp{flex:1}.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
:focus-visible,.btn:focus-within{outline:3px solid var(--red);outline-offset:2px}
.hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--bd)}
.lgw{background:#fff;border-radius:10px;padding:2px 8px;display:inline-flex}.lgw img{height:40px;width:auto;display:block}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;cursor:pointer}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;font-weight:600;position:relative;transition:transform .1s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}.pri{background:var(--red);border-color:var(--red);color:#fff}.dan{color:var(--red);border-color:var(--red)}.sm{min-height:38px;padding:0 12px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mu);cursor:pointer;min-height:58px}
nav button.on{color:var(--red);font-weight:700}
main{padding:16px 14px 100px;max-width:960px;margin:0 auto;outline:0;animation:in .3s both}
@media(min-width:900px){nav{top:66px;bottom:0;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:12px;gap:4px}nav button{flex:none;flex-direction:row;font-size:14px;gap:12px;padding:0 14px;border-radius:10px;justify-content:flex-start;min-height:46px}nav button.on{background:rgba(216,35,42,.1)}main{margin:0 auto 0 230px;padding-bottom:30px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px;animation:in .35s both}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.stat b{font-size:30px;display:block;line-height:1.1}.stat span{color:var(--mu);font-size:13px}
.stat.r{border-left:4px solid var(--red)}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}.rq{color:var(--red)}
.in{width:100%;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
textarea.in{resize:vertical}.in.err{border-color:var(--red);box-shadow:0 0 0 2px rgba(216,35,42,.25)}
.er{color:var(--red);font-size:12px;display:block;min-height:0}
.badge{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid currentColor;vertical-align:middle}
.Passed{color:var(--ok)}.Failed{color:var(--red)}.Pending{color:var(--wa)}.Draft{color:var(--mu)}
.row{cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between}.row:hover{border-color:var(--red)}
.note{border-left:4px solid var(--red);background:rgba(216,35,42,.07);padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.it.f{border-color:var(--red);background:rgba(216,35,42,.06)}
.sg{display:flex;gap:6px;margin:8px 0}.sg button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-weight:700;cursor:pointer}
.sg .on{color:#fff;border-color:transparent}.sg .on[data-s=P]{background:#16794a}.sg .on[data-s=F]{background:#d8232a}.sg .on[data-s=N]{background:#555}
.th{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}.th div{position:relative}
.th img{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);cursor:pointer;animation:in .25s}
.th button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;font-size:16px}
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:14px;animation:fd .2s}.ov.out{opacity:0;transition:opacity .15s}
.md{background:var(--card);border-radius:16px;max-width:760px;width:100%;max-height:92vh;display:flex;flex-direction:column;padding:18px;animation:pop .25s;outline:0}
.md h2{margin:0 0 10px}.mb{overflow:auto;flex:1}.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.big{max-width:100%;max-height:70vh;display:block;margin:auto;border-radius:8px}
.dev{font-size:22px;font-weight:800;text-align:center;padding:26px 8px;letter-spacing:.5px}
.okc{width:72px;height:72px;margin:0 auto 10px;color:#fff;background:var(--ok);border-radius:50%;display:grid;place-items:center}.okc path{stroke-dasharray:30;animation:dr .6s .2s both}
#toasts{position:fixed;left:0;right:0;bottom:78px;z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#111;color:#fff;padding:10px 16px;border-radius:12px;border-left:4px solid #16794a;animation:pop .25s;max-width:92vw}.toast.err{border-color:var(--red)}
.pr{height:6px;border-radius:3px;background:var(--bd);overflow:hidden}.pr i{display:block;height:100%;background:var(--red);transition:width .3s}
.tm{font:700 34px ui-monospace,monospace;text-align:center;padding:6px}
#intro{position:fixed;inset:0;z-index:100;background:#0a0a0a;color:#fff;display:grid;place-items:center;text-align:center;transition:opacity .6s;overflow:hidden}
#intro .glow{position:absolute;inset:-20%;background:radial-gradient(circle at 25% 30%,rgba(216,35,42,.4),transparent 40%),radial-gradient(circle at 75% 70%,rgba(216,35,42,.28),transparent 40%);animation:gl 7s ease-in-out infinite alternate}
#intro .ic{position:relative;padding:20px;width:min(520px,100%)}#intro .lgw{animation:lg 1s both}#intro .lgw img{height:110px}
#intro h1{font-size:clamp(24px,6vw,38px);letter-spacing:3px;margin:22px 0 6px}#intro h2{font-size:clamp(11px,2.8vw,14px);letter-spacing:2px;color:#ccc;margin:0 0 16px}#intro p{color:#ff7b80;min-height:24px;margin:0 0 20px}
#intro .pr{width:70%;margin:0 auto 18px;background:#333}#intro .pr i{width:0;animation:pg 3.3s .2s linear forwards}
#skip{background:none;border:1px solid #555;color:#ccc;border-radius:10px;padding:8px 18px;cursor:pointer}
.ch{opacity:0;display:inline-block;white-space:pre;animation:fd .3s forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}}@keyframes fd{to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.94)}}@keyframes dr{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@keyframes gl{to{transform:translate(4%,3%) scale(1.15)}}@keyframes lg{from{opacity:0;transform:scale(.8)}}@keyframes pg{to{width:100%}}
.rp{background:#fff;color:#111;font:12px/1.4 Arial,sans-serif}.rp h1{font-size:20px;margin:0 0 4px}.rp h2{font-size:14px;border-bottom:2px solid #d8232a;padding-bottom:3px;margin:16px 0 6px;break-after:avoid;color:#111}
.rp table{width:100%;border-collapse:collapse}.rp td,.rp th{border:1px solid #ccc;padding:4px 6px;text-align:left;vertical-align:top}.rp tr{break-inside:avoid}
.rp .ph{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rp figure{margin:0;break-inside:avoid}.rp figure img{width:100%;max-height:85mm;object-fit:contain;background:#f3f3f3;border:1px solid #ccc;display:block}.rp figcaption{font-size:10px;color:#444}
.rp .sF{color:#d8232a;font-weight:700}.rp .sP{color:#16794a;font-weight:700}.rp .hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #d8232a;padding-bottom:8px}.rp .hdr img{height:60px}.rp .ft{margin-top:16px;font-size:10px;color:#555;border-top:1px solid #ccc;padding-top:6px}
#pr{display:none}
@media print{@page{size:A4;margin:14mm 12mm 16mm;@bottom-center{content:"Supreme Finance - Page " counter(page) " of " counter(pages);font:9px Arial;color:#555}}body>*:not(#pr){display:none!important}#pr{display:block}body{background:#fff}.rp{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style></head>
<body>
<div id="intro" aria-label="Introduction"><div class="glow"></div><div class="ic"><div class="lgw"><img data-logo alt="Supreme Finance logo"></div><h1 id="t1" aria-label="SUPREME FINANCE"></h1><h2 id="t2" aria-label="GENERATOR &amp; ALARM INSPECTION SYSTEM"></h2><p id="t3" aria-label="Inspect. Record. Verify. Protect."></p><div class="pr"><i></i></div><button id="skip">Skip introduction</button></div></div>
<div id="app" hidden>
<header class="hd"><span class="lgw"><img data-logo alt="Supreme Finance"></span><div class="sp"></div><button class="btn pri sm" data-a="inst" id="inst" hidden></button><button class="ib" data-a="thm" id="thm" aria-label="Toggle light and dark theme"></button></header>
<nav id="nav" aria-label="Primary"></nav>
<main id="main" tabindex="-1"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="pr"></div>
<noscript>This application requires JavaScript.</noscript>

${sel('rs','Status / result',['','draft','Passed','Failed','Pending Verification'].map(v=>`<option value="${v}"${f.rs===v?' selected':''}>${v||'All statuses'}</option>`).join(''))}

function hFilter(){if(S.view!=='hist')return;const g=i=>$('#'+i).value,f=S.f={q:g('q'),ty:g('ty'),rs:g('rs'),br:g('br'),ins:g('ins'),d1:g('d1'),d2:g('d2'),so:g('so')};f.branch=f.br;f.insp=f.ins;const q=f.q.toLowerCase();
const l=S.all.filter(r=>(!q||[r.ref,r.d.branch,r.d.insp].some(v=>String(v||'').toLowerCase().includes(q)))&&(!f.ty||r.type===f.ty)&&(!f.rs||(r.status==='draft'?'draft':r.result)===f.rs)&&(!f.br||r.d.branch===f.br)&&(!f.ins||r.d.insp===f.ins)&&(!f.d1||(r.d.date||'')>=f.d1)&&(!f.d2||(r.d.date||'')<=f.d2));
l.sort((a,b)=>{const x=(a.d.date||'')+(a.d.time||''),y=(b.d.date||'')+(b.d.time||'');return f.so==='old'?x.localeCompare(y):y.localeCompare(x)});
$('#hl').innerHTML=l.length?`<p class="mu">${l.length} record(s)</p>`+l.map(row).join(''):'<div class="card mu">No inspections match these filters.</div>'}

async function vSet(){const a=await all('inspections'),np=await rq(st('photos').count()),n=(t)=>a.filter(r=>r.type===t&&r.status==='completed').length;let est='unavailable';try{const e=await navigator.storage.estimate();est=(e.usage/1048576).toFixed(1)+' MB used of ~'+Math.round(e.quota/1048576)+' MB available'}catch(e){}
main.innerHTML=`<h1>Settings</h1><div class="card"><b>Install app</b><p class="mu">Install for a full-screen experience.</p><button class="btn pri" data-a="inst">${ic('dl')} Install App</button></div>
<div class="card"><b>Data management</b><div class="g" style="margin:10px 0"><div><b>${n('gen')}</b><br><span class="mu">Generator inspections</span></div><div><b>${n('alarm')}</b><br><span class="mu">Alarm inspections</span></div><div><b>${a.filter(r=>r.status==='draft').length}</b><br><span class="mu">Drafts</span></div><div><b>${np}</b><br><span class="mu">Stored photographs</span></div></div><p class="mu">Storage: ${h(est)}</p>

<div class="card"><b>Important limitations</b><ul><li>Data is stored <b>on this device and browser only</b> (IndexedDB). It does <b>not</b> synchronise between devices.</li><li>Clearing browser data, resetting the device or storage eviction can permanently delete records. Export backups regularly.</li><li>Local browser storage is not server-grade security. A production deployment needs authentication, authorisation, secure synchronisation, backups and company approval.</li></ul></div>
<div class="card"><b>About</b><p>Supreme Finance Generator &amp; Alarm Inspection System.</p><button class="btn" data-a="dev">View developer credits</button> <button class="btn" data-a="replay">Replay introduction</button><p class="mu" style="margin-bottom:0">Developed by Melato Tatu</p></div>`}
const b2d=b=>new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>j(f.error);f.readAsDataURL(b)});
act.exp=async b=>{b.disabled=true;try{const ins=await all('inspections'),ps=await all('photos'),out={app:'supreme-finance',v:1,at:new Date().toISOString(),inspections:ins,photos:await Promise.all(ps.map(async p=>({id:p.id,insp:p.insp,item:p.item,data:await b2d(p.blob)})))};dl(new Blob([JSON.stringify(out)],{type:'application/json'}),'supreme-finance-backup-'+today()+'.json');toast('Backup download started')}catch(e){toast('Export failed: '+e.message,'err')}finally{b.disabled=false}};
async function imp(file){try{const j=JSON.parse(await file.text());if(j.app!=='supreme-finance'||!Array.isArray(j.inspections)||!Array.isArray(j.photos))throw new Error('Not a Supreme Finance backup');
const ok=r=>r&&typeof r.id==='string'&&CFG[r.type]&&['draft','completed'].includes(r.status)&&r.d&&typeof r.d==='object'&&r.items&&typeof r.items==='object';if(!j.inspections.every(ok))throw new Error('Backup contains invalid inspection records');
if(!j.photos.every(p=>p&&typeof p.id==='string'&&typeof p.insp==='string'&&/^data:image\//.test(p.data)))throw new Error('Backup contains invalid photographs');
const ex=new Set((await all('inspections')).map(r=>r.id)),nw=j.inspections.filter(r=>!ex.has(r.id)),cf=j.inspections.length-nw.length;
const k=await modal('Restore backup',`<p>${nw.length} new record(s) will be imported.</p><p>${cf} record(s) already exist on this device and will be <b>skipped</b> — existing records are never overwritten.</p>`,[['Cancel',''],['Import','pri']]);if(k!==1)return;
const ids=new Set(nw.map(r=>r.id));for(const r of nw)await put('inspections',r);let np=0;for(const p of j.photos)if(ids.has(p.insp)){await put('photos',{id:p.id,insp:p.insp,item:p.item,blob:await (await fetch(p.data)).blob(),t:Date.now()});np++}
toast(`Imported ${nw.length} record(s) and ${np} photo(s)`);go('set')}catch(e){toast('Import failed: '+e.message,'err')}}

const {rec,ph}=S.cur,T=CFG[rec.type];calc(rec);const F=T.items.map((n,i)=>[n,rec.items[i]]).filter(x=>x[1].s==='F'),cnt=s=>Object.values(rec.items).filter(x=>x.s===s).length;
